[project]
name = "flighty-exporter"
version = "0.1.0"
description = "Backfill historical flights into Flighty from a Gmail Takeout mbox using local models."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["flighty", "flights", "gmail", "takeout", "mbox", "ollama", "openflights", "local-llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Utilities",
]
dependencies = [
    "pypdf>=7.1.0",
    "textual>=8.2,<9",
]

[project.scripts]
flighty-exporter = "flighty_exporter.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flighty_exporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
